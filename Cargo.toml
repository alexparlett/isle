[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["spikes"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false

[workspace.dependencies]
isle-ipc = { path = "crates/isle-ipc" }
isle-settings = { path = "crates/isle-settings" }
isle-settings-derive = { path = "crates/isle-settings-derive" }
isle-state = { path = "crates/isle-state" }
isle-shell = { path = "crates/isle-shell" }
isle-tokens = { path = "crates/isle-tokens" }
isle-ui = { path = "crates/isle-ui" }

# The fork (B7); `.cargo/config.toml`, git-ignored, may patch it to a local checkout.
freya = { git = "https://github.com/alexparlett/freya", rev = "e3ee6d0e40a3f5fe41551291d3fda8a31d3fcaa8", default-features = false }
freya-embed = { git = "https://github.com/alexparlett/freya", rev = "e3ee6d0e40a3f5fe41551291d3fda8a31d3fcaa8" }
accesskit = "0.24"

# Upstream master until alexparlett/smithay exists; moving changes only the URL (B6).
smithay = { git = "https://github.com/Smithay/smithay", rev = "118e34ffc9b99854a2230c4805e1f37dc9029edb", default-features = false, features = [
    "backend_drm",
    "backend_egl",
    "backend_gbm",
    "backend_libinput",
    "backend_session_libseat",
    "backend_udev",
    "backend_winit",
    "desktop",
    "renderer_gl",
    "wayland_frontend",
] }
libc = "0.2"
png = "0.17"
smithay-drm-extras = { git = "https://github.com/Smithay/smithay", rev = "118e34ffc9b99854a2230c4805e1f37dc9029edb" }
xcursor = "0.3"
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
humantime = "2.3"
kdl = { version = "6.7", features = ["span"] }
miette = { version = "7", default-features = false }
notify = { version = "8.2", default-features = false }
zbus = { version = "5.19", default-features = false, features = ["tokio"] }
zvariant = "5"
tokio = { version = "1.53", features = ["macros", "rt", "rt-multi-thread", "sync", "time"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.6", features = ["derive"] }
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
proc-macro2 = "1.0"
quote = "1.0"
syn = { version = "2.0", features = ["full"] }

[profile.release]
debug = 1
