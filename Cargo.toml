[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["spikes"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false

[workspace.dependencies]
isle-app = { path = "crates/isle-app" }
isle-apps = { path = "crates/isle-apps" }
isle-auth = { path = "crates/isle-auth" }
isle-audio = { path = "crates/isle-audio" }
isle-bluetooth = { path = "crates/isle-bluetooth" }
isle-brightness = { path = "crates/isle-brightness" }
isle-bus = { path = "crates/isle-bus" }
isle-fakes = { path = "crates/isle-fakes" }
isle-power = { path = "crates/isle-power" }
isle-disks = { path = "crates/isle-disks" }
isle-focus = { path = "crates/isle-focus" }
isle-games = { path = "crates/isle-games" }
isle-sun = { path = "crates/isle-sun" }
isle-system-settings = { path = "crates/isle-system-settings" }
isle-ipc = { path = "crates/isle-ipc" }
isle-keys = { path = "crates/isle-keys" }
isle-media = { path = "crates/isle-media" }
isle-menus = { path = "crates/isle-menus" }
isle-network = { path = "crates/isle-network" }
isle-notifications = { path = "crates/isle-notifications" }
isle-polkit = { path = "crates/isle-polkit" }
isle-portal = { path = "crates/isle-portal" }
isle-prompter = { path = "crates/isle-prompter" }
isle-settings = { path = "crates/isle-settings" }
isle-settings-derive = { path = "crates/isle-settings-derive" }
isle-state = { path = "crates/isle-state" }
isle-search = { path = "crates/isle-search" }
isle-shell = { path = "crates/isle-shell" }
isle-tokens = { path = "crates/isle-tokens" }
isle-tray = { path = "crates/isle-tray" }
isle-ui = { path = "crates/isle-ui" }

# The fork (B7); `.cargo/config.toml`, git-ignored, may patch it to a local checkout.
freya = { git = "https://github.com/alexparlett/freya", rev = "8b168e907cc9ce7389867f5a7ebd063b5f5ac81f", default-features = false }
freya-embed = { git = "https://github.com/alexparlett/freya", rev = "8b168e907cc9ce7389867f5a7ebd063b5f5ac81f" }
accesskit = "0.24"
accesskit_unix = "0.22"

# The fork (B6): its `isle` branch, upstream at 118e34f with Isle's patches.
smithay = { git = "https://github.com/alexparlett/smithay", rev = "10e6b3c62f45b4a2ab805a2c77dfc3e5d611a2ba", default-features = false, features = [
    "backend_drm",
    "backend_egl",
    "backend_gbm",
    "backend_libinput",
    "backend_session_libseat",
    "backend_udev",
    "backend_winit",
    "desktop",
    "renderer_gl",
    "wayland_frontend",
    "xwayland",
] }
libc = "0.2"
zeroize = "1"
png = "0.17"
smithay-drm-extras = { git = "https://github.com/alexparlett/smithay", rev = "10e6b3c62f45b4a2ab805a2c77dfc3e5d611a2ba" }
xcursor = "0.3"
xkbcommon = "0.9"
wayland-client = "0.31"
wayland-server = "0.31"
wayland-backend = "0.3"
wayland-scanner = "0.31"
wayland-protocols-plasma = "0.3"
wayland-protocols = { version = "0.32", features = ["client", "staging", "unstable"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
x11rb = { version = "0.13", default-features = false, features = ["shape"] }
humantime = "2.3"
jiff = "0.2"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
kdl = { version = "6.7", features = ["span"] }
miette = { version = "7", default-features = false }
notify = { version = "8.2", default-features = false }
zbus = { version = "5.19", default-features = false, features = ["tokio"] }
zvariant = "5"
futures-util = { version = "0.3", default-features = false }
tokio = { version = "1.53", features = ["macros", "process", "rt", "rt-multi-thread", "sync", "time"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.6", features = ["derive"] }
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
proc-macro2 = "1.0"
quote = "1.0"
syn = { version = "2.0", features = ["full"] }

[profile.release]
debug = 1

# Wallpapers decode and scale on the worker; unoptimised, a large one takes seconds.
[profile.dev.package.image]
opt-level = 3
[profile.dev.package.zune-jpeg]
opt-level = 3
[profile.dev.package.image-webp]
opt-level = 3
[profile.dev.package.fdeflate]
opt-level = 3
[profile.dev.package.png]
opt-level = 3
