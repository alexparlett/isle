# cachy-update (CachyOS's build of arch-update) — the update notifier.
#
# The systemd user timer arch-update.timer checks daily and sends a desktop
# notification; Waybar polls the same package lists for its badge.
# `cachy-update` with no arguments runs the interactive update.

# paru is installed and already configured on this machine.
AURHelper=paru

# Show Arch news before applying an update — this is what saves you from the
# manual-intervention breakages.
NewsNum=5

# Keep three old versions of each package in the cache so a downgrade is
# always possible after a bad update.
KeepOldPackages=3
KeepUninstalledPackages=0

# The tray applet is redundant here: Waybar has its own updates module and
# runs cachy-update on click. Left disabled by not autostarting it.
