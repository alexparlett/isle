################################################################################
#  hypridle
#
#  Desktop machine, so no suspend by default — the screen blanks and locks and
#  that's it. Uncomment the suspend listener at the bottom if you want more.
################################################################################

general {
    lock_cmd = pidof hyprlock || hyprlock      # never stack lockers
    before_sleep_cmd = loginctl lock-session   # lock before the box sleeps
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
    ignore_dbus_inhibit = false                # respect idle inhibitors
    ignore_systemd_inhibit = false
    inhibit_sleep = 2                          # auto
}

# 5 min — blank the panel, unless an agent is mid-task.
#
# condition_cmd runs first and only lets on-timeout fire if it exits 0.
# agent-busy.sh exits 1 while a Claude Code or Codex session is working, so a
# long agent run no longer blanks the screen out from under you. condition_retry
# re-checks every 30s, so it blanks shortly after the work actually finishes
# rather than waiting for the next idle cycle.
listener {
    timeout = 300
    condition_cmd = ~/.config/hypr/scripts/agent-busy.sh
    condition_retry = 30
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}

# 10 min — lock. Same deferral: locking mid-task does not stop the agent, but
# coming back to a lock screen instead of the output is a poor trade.
listener {
    timeout = 600
    condition_cmd = ~/.config/hypr/scripts/agent-busy.sh
    condition_retry = 30
    on-timeout = loginctl lock-session
}

# 30 min — mute the mic so a forgotten call doesn't listen to your kitchen.
listener {
    timeout = 1800
    on-timeout = wpctl set-mute @DEFAULT_AUDIO_SOURCE@ 1
    on-resume = wpctl set-mute @DEFAULT_AUDIO_SOURCE@ 0
}

# Suspend after an hour — off by default on this box.
# listener {
#     timeout = 3600
