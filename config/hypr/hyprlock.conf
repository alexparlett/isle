################################################################################
#  hyprlock — Catppuccin Mocha
################################################################################

general {
    hide_cursor = true
    ignore_empty_input = true
    immediate_render = true
    fractional_scaling = 0
}

auth {
    fingerprint:enabled = false
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
    noise = 0.011
    contrast = 0.9
    brightness = 0.6
    vibrancy = 0.17
}

# --- Clock -------------------------------------------------------------------
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = rgba(cdd6f4ff)
    font_size = 120
    font_family = JetBrainsMono Nerd Font ExtraBold
    position = 0, 180
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(11111baa)
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %e %B"
    color = rgba(a6adc8ff)
    font_size = 22
    font_family = JetBrainsMono Nerd Font
    position = 0, 80
    halign = center
    valign = center
}

# --- User --------------------------------------------------------------------
label {
    monitor =
    text =    $USER
    color = rgba(cba6f7ff)
    font_size = 16
    font_family = JetBrainsMono Nerd Font
    position = 0, -60
    halign = center
    valign = center
}

# --- Password ----------------------------------------------------------------
input-field {
    monitor =
    size = 340, 55
    outline_thickness = 2
    dots_size = 0.28
    dots_spacing = 0.3
    dots_center = true
    dots_rounding = -1

    outer_color = rgba(cba6f7ff)
    inner_color = rgba(1e1e2edd)
    font_color = rgba(cdd6f4ff)
    check_color = rgba(89b4faff)
    fail_color = rgba(f38ba8ff)

    fade_on_empty = false
    placeholder_text = <span foreground="##6c7086"><i>Password…</i></span>
    fail_text = <span foreground="##f38ba8">$FAIL ($ATTEMPTS)</span>
    hide_input = false
    rounding = 12

    position = 0, -130
    halign = center
    valign = center
}

# --- Status line -------------------------------------------------------------
label {
    monitor =
    text =   Enter to unlock  ·    Esc to clear
    color = rgba(6c7086ff)
    font_size = 13
    font_family = JetBrainsMono Nerd Font
    position = 0, 40
    halign = center
    valign = bottom
}
