################################################################################
#  hyprpaper
#
#  The default wallpaper is generated by scripts/gen-wallpaper.sh at install
#  time (3440x1440 Catppuccin Mocha gradient) so no binary blob lives in git.
#  Drop your own PNG/JPG in ~/.config/hypr/wallpapers and point at it here.
################################################################################

preload = ~/.config/hypr/wallpapers/mocha-gradient.png
wallpaper = , ~/.config/hypr/wallpapers/mocha-gradient.png

splash = false
ipc = on
