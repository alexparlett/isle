# hyprsunset — night light.
#
# Applies at the compositor level rather than as a screen shader, so it does
# not show up in screenshots or screen recordings.
# SUPER+F9 / SUPER+F10 override the active profile by hand.

max-gamma = 100

# Daytime: no filter at all.
profile {
    time = 7:00
    identity = true
}

# Evening: warm, and a touch dimmer than the panel's own minimum.
profile {
    time = 21:00
    temperature = 4500
    gamma = 0.9
}

# Late: warmer still.
profile {
    time = 23:30
    temperature = 3600
    gamma = 0.85
}
