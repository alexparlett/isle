# hypr-mac-profile — Mac keyboard behaviour for Linux, via keyd.
#
# Optional. Install with: ./install.sh --mac-keys   (needs sudo — keyd is a
# system daemon reading evdev before anything else sees the keys).
#
# Without this file, input.lua swaps Alt and Super at the xkb level, which is
# enough for the window-manager shortcuts to land under the ⌘ cap. What it
# cannot do is make ⌘C mean copy inside applications, because Linux apps expect
# Ctrl. That is what this profile adds.
#
# How it works:
#   - The physical Alt key (wearing the ⌘ cap) becomes a layer key.
#   - Inside that layer, the shortcuts every Mac user has in their fingers are
#     rewritten to their Ctrl equivalents.
#   - Anything NOT listed falls through as plain Super, so Hyprland still gets
#     ⌘Space, ⌘Q, ⌘Tab, ⌘1-9 and the rest of binds.lua.
#
# The marker string "hypr-mac-profile" above is load-bearing: input.lua greps
# for it to decide whether to skip the xkb swap. Don't remove it.
#
# Check what keyd sees with:  sudo keyd monitor
# Reload after editing with:  sudo keyd reload

[ids]
*

[main]
# The ⌘ cap (physical left Alt) becomes our command layer.
leftalt = layer(cmd)
# The ⌥ cap (physical left Super) becomes a real Alt.
leftmeta = layer(alt)

# Right-hand side, for keyboards that have both.
rightalt = layer(cmd)
rightmeta = layer(alt)

[cmd:M]
# ---------------------------------------------------------------------------
# Text editing and file management — the reflexes worth preserving.
# Everything here is sent to the application as Ctrl+<key>.
# ---------------------------------------------------------------------------
c = C-c
v = C-v
x = C-x
z = C-z
y = C-y
s = C-s
o = C-o
p = C-p
n = C-n
t = C-t
f = C-f
g = C-g
r = C-r
l = C-l
d = C-d
b = C-b
i = C-i
u = C-u
k = C-k
j = C-j
comma = C-comma

# ⌘A is Select All. ⌘Q and ⌘W are deliberately absent so Hyprland keeps them
# for closing windows — on a Mac those are app-level, but a tiler has no other
# sensible home for them.
a = C-a

# ⌘⇧Z is Redo on macOS; Linux apps want Ctrl+Shift+Z, which this produces.
# (Shift passes through the layer untouched, so no explicit entry is needed.)

# Line and document navigation: ⌘←/→ are Home/End, ⌘↑/↓ are document ends.
left = home
right = end
up = C-home
down = C-end
backspace = C-backspace

# ---------------------------------------------------------------------------
# Everything else in this layer falls through as Super, which is what
# binds.lua expects: ⌘Space, ⌘Return, ⌘Tab, ⌘1-9, ⌘⇧3/4/5, ⌘H and so on.
# ---------------------------------------------------------------------------

[alt:A]
# The ⌥ cap behaves as a normal Alt. Word-wise navigation matches macOS.
left = C-left
right = C-right
backspace = C-backspace
