; qt6ct — theming for Qt apps that are NOT KDE apps.
;
; KDE apps (Dolphin, Okular, Ark) read ~/.config/kdeglobals instead and keep
; looking correct on their own. This file is what stops everything else from
; rendering in default Fusion grey.
;
; Fonts are deliberately not set here: qt6ct stores them as Qt binary blobs,
; which do not hand-edit safely. Set them once in the qt6ct GUI if the
; defaults bother you.
;
; style=Fusion + the palette below needs no extra packages. For a richer look,
; install Kvantum plus a Catppuccin Kvantum theme and set style=kvantum-dark.

[Appearance]
style=Fusion
color_scheme_path=~/.config/qt6ct/colors/catppuccin-mocha.conf
custom_palette=true
icon_theme=Papirus-Dark
standard_dialogs=default

[Interface]
activate_item_on_single_click=1
buttonbox_layout=0
cursor_flash_time=1000
dialog_buttons_have_icons=1
double_click_interval=400
keyboard_scheme=2
menus_have_icons=true
show_shortcuts_in_context_menus=true
toolbutton_style=4
underline_shortcut=1
wheel_scroll_lines=3
