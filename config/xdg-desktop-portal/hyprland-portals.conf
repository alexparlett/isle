# Which portal backend answers which interface under Hyprland.
#
# hyprland  — screenshot, screencast, global shortcuts (the Wayland-native bits)
# gtk       — everything else, notably the file chooser
#
# Deliberately not `kde` for the file chooser: xdg-desktop-portal-kde is a
# dependency of plasma-workspace, so it disappears the moment you run
# remove-plasma.sh. gtk keeps working either way.

[preferred]
default = hyprland;gtk
org.freedesktop.impl.portal.FileChooser = gtk
org.freedesktop.impl.portal.Settings = gtk
