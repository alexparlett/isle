# yazi — terminal file manager
#
# Paired with kitty deliberately: previews render through the kitty graphics
# protocol, so images, video thumbnails and PDF pages appear as actual images
# rather than ASCII approximations.
#
# Bound to ⌘⇧E (Win+Shift+E on the Windows profile). Dolphin is still on ⌘E —
# these are for different jobs, and reading a repo is much faster here.

[mgr]
ratio          = [1, 3, 4]   # parent, current, preview — wide preview suits an ultrawide
sort_by        = "natural"
sort_sensitive = false
sort_reverse   = false
sort_dir_first = true
linemode       = "size"
show_hidden    = false
show_symlink   = true
scrolloff      = 5

[preview]
wrap        = "no"
tab_size    = 4
max_width   = 1200
max_height  = 1800
cache_dir   = ""
image_delay = 30
ueberzug_scale  = 1
ueberzug_offset = [0, 0, 0, 0]

[opener]
edit = [
  { run = '${EDITOR:-nvim} "$@"', desc = "Edit", block = true, for = "unix" },
]
open = [
  { run = 'xdg-open "$1"', desc = "Open", orphan = true, for = "unix" },
]
reveal = [
  { run = 'dolphin "$1"', desc = "Reveal in file manager", orphan = true, for = "unix" },
]
extract = [
  { run = 'ya pub extract --list "$@"', desc = "Extract here", for = "unix" },
]
play = [
  { run = 'mpv --force-window "$@"', orphan = true, for = "unix" },
]

[open]
rules = [
  { name = "*/", use = [ "edit", "open", "reveal" ] },
  { mime = "text/*",  use = [ "edit", "reveal" ] },
  { mime = "image/*", use = [ "open", "reveal" ] },
  { mime = "video/*", use = [ "play", "reveal" ] },
  { mime = "audio/*", use = [ "play", "reveal" ] },
  { mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*}", use = [ "extract", "reveal" ] },
  { mime = "application/{json,ndjson}", use = [ "edit", "reveal" ] },
  { mime = "*/javascript", use = [ "edit", "reveal" ] },
  { mime = "*", use = [ "open", "reveal" ] },
]

[tasks]
micro_workers    = 10
macro_workers    = 10
bizarre_retry    = 3
image_alloc      = 536870912
image_bound      = [0, 0]
suppress_preload = false
