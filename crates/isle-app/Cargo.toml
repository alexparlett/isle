[package]
name = "isle-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# Contexts for testing an app's components headless.
testing = []
# Freya's GPU renderers beside the software one, chosen by FREYA_RENDERER.
gpu = ["freya/gpu"]

[dependencies]
freya = { workspace = true, features = ["winit", "accessibility"] }
# For the pointer events a drag over a window is turned into.
freya-core = { git = "https://github.com/alexparlett/freya", rev = "2cf6468f62dde93bf427e55a93c523c72a8d0465" }
freya-winit = { git = "https://github.com/alexparlett/freya", rev = "2cf6468f62dde93bf427e55a93c523c72a8d0465" }
futures-channel = "0.3"
zeroize.workspace = true
futures-util.workspace = true
isle-ipc.workspace = true
isle-menus.workspace = true
isle-settings.workspace = true
isle-tokens.workspace = true
isle-ui.workspace = true
raw-window-handle = "0.6"
smithay-client-toolkit = { version = "0.20", default-features = false }
rustix = { version = "1.1", features = ["event", "pipe"] }
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
wayland-backend = { workspace = true, features = ["client_system"] }
wayland-client.workspace = true
wayland-protocols.workspace = true
wayland-protocols-plasma = { workspace = true, features = ["client"] }
wayland-scanner.workspace = true
zbus.workspace = true
zvariant.workspace = true

[dev-dependencies]
freya-testing = { git = "https://github.com/alexparlett/freya", rev = "2cf6468f62dde93bf427e55a93c523c72a8d0465" }
