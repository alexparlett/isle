[package]
name = "isle-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# Contexts for testing an app's components headless.
testing = []
# Freya's GPU renderers beside the software one, chosen by FREYA_RENDERER.
gpu = ["freya/gpu"]

[dependencies]
freya = { workspace = true, features = ["winit", "accessibility"] }
futures-channel = "0.3"
futures-util.workspace = true
isle-ipc.workspace = true
isle-menus.workspace = true
isle-settings.workspace = true
isle-tokens.workspace = true
isle-ui.workspace = true
raw-window-handle = "0.6"
smithay-clipboard = "0.7"
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
wayland-backend = { workspace = true, features = ["client_system"] }
wayland-client.workspace = true
wayland-protocols.workspace = true
wayland-protocols-plasma = { workspace = true, features = ["client"] }
wayland-scanner.workspace = true
zbus.workspace = true
zvariant.workspace = true

[dev-dependencies]
freya-testing = { git = "https://github.com/alexparlett/freya", rev = "ce0e9fe46ab7f60faa818091cdb588c20d3bb6d9" }
