[package]
name = "isle-compositor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# The Test interface: input injection, forced stalls and panics. Never in a package.
test-hooks = [
    "isle-auth/test-hooks",
    "isle-shell/probe",
    "isle-menus/exporter",
    "wayland-protocols-plasma/client",
    "dep:png",
    "dep:wayland-client",
    "dep:wayland-protocols",
    "dep:wayland-protocols-wlr",
]

[[bin]]
name = "isle-test-x11-client"
path = "src/bin/test_x11_client.rs"
required-features = ["test-hooks"]

[[bin]]
name = "isle-test-client"
path = "src/bin/test_client.rs"
required-features = ["test-hooks"]

[dependencies]
humantime.workspace = true
image.workspace = true
jiff.workspace = true
serde.workspace = true
serde_json.workspace = true
isle-apps.workspace = true
isle-auth.workspace = true
isle-audio.workspace = true
isle-bluetooth.workspace = true
isle-brightness.workspace = true
isle-bus.workspace = true
isle-power.workspace = true
isle-disks.workspace = true
isle-focus.workspace = true
isle-games.workspace = true
isle-search.workspace = true
isle-keys.workspace = true
isle-ipc.workspace = true
isle-settings.workspace = true
isle-shell.workspace = true
isle-tray.workspace = true
isle-tokens.workspace = true
isle-ui.workspace = true
isle-state.workspace = true
libc.workspace = true
notify.workspace = true
zeroize.workspace = true
png = { workspace = true, optional = true }
wayland-client = { workspace = true, optional = true }
wayland-protocols = { workspace = true, optional = true }
wayland-protocols-wlr = { workspace = true, optional = true }
x11rb.workspace = true
smithay.workspace = true
isle-media.workspace = true
isle-menus.workspace = true
isle-network.workspace = true
isle-notifications.workspace = true
isle-polkit.workspace = true
isle-prompter.workspace = true
wayland-server.workspace = true
wayland-backend.workspace = true
wayland-scanner.workspace = true
wayland-protocols-plasma = { workspace = true, features = ["server"] }
smithay-drm-extras.workspace = true
xcursor.workspace = true
tracing.workspace = true
