# A private PipeWire for the audio tests: null devices only, no session manager.
context.properties = {
    core.daemon = true
    core.name = pipewire-0
    module.rt = false
    support.dbus = false
}
context.spa-libs = {
    audio.convert.* = audioconvert/libspa-audioconvert
    support.*       = support/libspa-support
}
context.modules = [
    { name = libpipewire-module-protocol-native }
    { name = libpipewire-module-metadata }
    { name = libpipewire-module-spa-node-factory }
    { name = libpipewire-module-client-node }
    { name = libpipewire-module-client-device }
    { name = libpipewire-module-adapter }
    { name = libpipewire-module-link-factory }
    { name = libpipewire-module-access }
]
context.objects = [
    { factory = metadata args = { metadata.name = default metadata.values = [
        { key = default.audio.sink value = { name = isle-test-speakers } }
        { key = default.audio.source value = { name = isle-test-microphone } }
    ] } }
    { factory = adapter args = {
        factory.name = support.null-audio-sink node.name = isle-test-speakers
        node.description = "Test Speakers" media.class = Audio/Sink
        audio.position = [ FL FR ] monitor.channel-volumes = true object.linger = true adapter.auto-port-config = { mode = dsp monitor = true position = preserve } } }
    { factory = adapter args = {
        factory.name = support.null-audio-sink node.name = isle-test-microphone
        node.description = "Test Microphone" media.class = Audio/Source/Virtual
        audio.position = [ MONO ] object.linger = true adapter.auto-port-config = { mode = dsp monitor = true position = preserve } } }
    { factory = adapter args = {
        factory.name = support.null-audio-sink node.name = isle-test-camera
        node.description = "Test Camera" media.class = Audio/Source/Virtual media.role = Camera
        audio.position = [ MONO ] object.linger = true adapter.auto-port-config = { mode = dsp monitor = true position = preserve } } }
    { factory = adapter args = {
        factory.name = support.null-audio-sink node.name = isle-test-call
        node.description = "Test Call" application.name = "Test Call" media.class = Audio/Sink
        audio.position = [ MONO ] object.linger = true adapter.auto-port-config = { mode = dsp monitor = true position = preserve } } }
]
