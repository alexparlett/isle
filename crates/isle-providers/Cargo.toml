[package]
name = "isle-providers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
gix = { version = "0.90", default-features = false, features = ["blocking-http-transport-reqwest-rust-tls", "sha1"], optional = true }
rustix = { version = "1.1", features = ["process"] }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["net", "io-util"] }
tracing.workspace = true

[features]
# Fetching and installing from git sources, which only the compositor does.
sources = ["dep:gix"]

[dev-dependencies]
tokio = { workspace = true, features = ["net", "io-util", "macros", "rt-multi-thread"] }
