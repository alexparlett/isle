[package]
name = "isle-record"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "isle-record"
path = "src/main.rs"

[dependencies]
ffmpeg-next = { version = "9", default-features = false, features = ["codec", "format", "software-scaling", "software-resampling"] }
libc.workspace = true
pipewire = { version = "0.10", features = ["v0_3_33"] }
