[package]
name = "isle-secrets"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
futures-util.workspace = true
isle-bus.workspace = true
isle-network.workspace = true
getrandom = "0.3"
