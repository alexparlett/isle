[package]
name = "isle-store"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "isle-store"
path = "src/main.rs"

[dependencies]
freya = { workspace = true, features = ["winit"] }
futures-channel = "0.3"
futures-util = { workspace = true, features = ["std"] }
isle-app.workspace = true
isle-catalog.workspace = true
isle-apps.workspace = true
isle-ipc.workspace = true
isle-tokens.workspace = true
isle-ui.workspace = true
isle-updates.workspace = true
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "query"] }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
zbus.workspace = true

[dev-dependencies]
freya-testing = { git = "https://github.com/alexparlett/freya", rev = "4ba3a34bc20edf6f81adfbcb5021ede6c36d50ce" }
isle-app = { workspace = true, features = ["testing"] }
