[package]
name = "isle-system-settings"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
gpu = ["isle-app/gpu"]

[[bin]]
name = "isle-settings"
path = "src/main.rs"

[dependencies]
freya = { workspace = true, features = ["winit"] }
isle-app.workspace = true
isle-apps.workspace = true
isle-audio.workspace = true
isle-bluetooth.workspace = true
isle-bus.workspace = true
isle-focus.workspace = true
isle-games.workspace = true
isle-ipc.workspace = true
isle-keys.workspace = true
isle-network.workspace = true
isle-power.workspace = true
isle-search.workspace = true
isle-tokens.workspace = true
isle-settings.workspace = true
isle-state.workspace = true
isle-ui.workspace = true
futures-util = { workspace = true, features = ["std"] }
libc.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
zbus.workspace = true
zvariant.workspace = true

[dev-dependencies]
freya-testing = { git = "https://github.com/alexparlett/freya", rev = "8b168e907cc9ce7389867f5a7ebd063b5f5ac81f" }
isle-app = { workspace = true, features = ["testing"] }
isle-settings.workspace = true
