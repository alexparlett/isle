[workspace]
resolver = "3"
members = ["base", "freya", "slint"]

[workspace.package]
edition = "2024"

[workspace.dependencies]
smithay = { git = "https://github.com/Smithay/smithay", rev = "118e34ffc9b99854a2230c4805e1f37dc9029edb", default-features = false, features = ["backend_winit", "renderer_gl"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
debug = 1
